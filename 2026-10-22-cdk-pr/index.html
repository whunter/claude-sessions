<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pull Request</title>
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 16px; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
    pre { background: #f6f8fa; padding: 12px; overflow-x: auto; border-radius: 6px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #d0d7de; padding: 6px 12px; }
    blockquote { margin: 0; padding-left: 1em; border-left: 4px solid #d0d7de; color: #59636e; }
  </style>
</head>
<body>
  <main id="content">Loading…</main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    fetch('pull-request.md')
      .then(r => r.text())
      .then(md => { document.getElementById('content').innerHTML = marked.parse(md); })
      .catch(err => { document.getElementById('content').textContent = 'Failed to load: ' + err; });
  </script>
</body>
</html>
